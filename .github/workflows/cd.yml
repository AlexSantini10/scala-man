name: Scala Delivery

on:
  push:
    # Temporary test mode: run on every push. Should be changed into "main" branch only after the first release.

jobs:
  delivery:
    name: Scala Delivery
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Compile and test
        run: sbt -v compile test

      - name: Build fat JAR
        run: sbt -v assembly

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - name: Build report PDF
        run: make -C report

      - name: Create delivery archive
        run: |
          set -e
          rm -rf delivery-package scala-man-delivery.zip
          mkdir -p delivery-package
          cp -R src delivery-package/src
          cp target/scala-*/scala-man-*-fat.jar delivery-package/
          cp report/report.pdf delivery-package/
          (cd delivery-package && zip -r ../scala-man-delivery.zip src *.jar report.pdf)

      - name: Validate delivery archive
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          archive = Path("scala-man-delivery.zip")

          with zipfile.ZipFile(archive) as zf:
              names = [name.rstrip("/") for name in zf.namelist() if name and not name.endswith("/")]

          root_files = sorted(name for name in names if "/" not in name)
          root_dirs = sorted({name.split("/", 1)[0] for name in names if "/" in name})

          errors = []
          jar_files = [name for name in root_files if name.endswith(".jar")]
          report_files = [name for name in root_files if name == "report.pdf"]
          other_root_files = [name for name in root_files if name not in {"report.pdf"} and not name.endswith(".jar")]

          if root_dirs != ["src"]:
              errors.append(f"expected the only root directory to be src, found {root_dirs}")
          if len(jar_files) != 1:
              errors.append(f"expected exactly one root fat jar, found {jar_files}")
          if len(report_files) != 1:
              errors.append(f"expected exactly one root report pdf, found {report_files}")
          if other_root_files:
              errors.append(f"unexpected root files: {other_root_files}")

          if errors:
              raise SystemExit("; ".join(errors))
          PY

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          make_latest: true
          generate_release_notes: false
          files: |
            scala-man-delivery.zip
